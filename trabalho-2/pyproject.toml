[project]
name = "trabalho-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ed Ferreira", email = "eduardoodferreiradev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno==3.1.7",
    "greenlet>=3.5.6",
    "pandas>=3.1.1",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
]

[project.scripts]
trabalho-2 = "views.app:main"

[tool.uv.build-backend]
module-name = ["models", "agents", "controllers", "views", "evaluation"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
